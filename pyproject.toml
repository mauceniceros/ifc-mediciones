[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-mediciones"
version = "0.1.0"
description = "Bill of quantities from IFC models, with every number traceable and doubtful data flagged for review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mauricio Ceniceros" }]
dependencies = ["ifcopenshell>=0.8", "openpyxl>=3.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ifc-mediciones = "ifc_mediciones.cli:main"

[tool.setuptools]
packages = ["ifc_mediciones"]

[tool.setuptools.package-data]
ifc_mediciones = ["config/*.yaml"]
